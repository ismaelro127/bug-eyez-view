
<!DOCTYPE html>
<html lang="en">
<head>
  <title>EPG DB Scraper Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1>📡 EPG Admin — Source Scraper Dashboard</h1>
    <p>Select a source and scrape live EPG:</p>
    <ul class="list-group">
      {% for s in sources %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ s.source_name }}
        <form method="post" action="{{ url_for('scrape', source_name=s.source_name) }}">
          <button class="btn btn-primary btn-sm">SCRAPE NOW</button>
        </form>
      </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
