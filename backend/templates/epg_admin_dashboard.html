```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🛠️ Admin EPG Dashboard</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    h1 { text-align: center; margin: 10px; }
    .container { display: flex; flex: 1; padding: 10px; gap: 10px; }
    .list { flex: 1; overflow-y: auto; background: #222; padding: 10px; border-radius: 8px; }
    .list h2 { margin-top: 0; text-align: center; }
    .item { background: #333; padding: 8px; margin-bottom: 6px; border-radius: 5px; cursor: pointer; }
    .item:hover { background: #444; }
    .selected { border: 2px solid #0af; }
    video { width: 100%; max-height: 300px; background: black; margin-top: 10px; border: 2px solid #555; }
    .btn { padding: 6px 10px; background: #0af; border: none; color: white; margin-top: 8px; cursor: pointer; border-radius: 4px; }
    .btn:hover { background: #09f; }
  </style>
</head>
<body>
  <h1>🛠️ Bug Eyez EPG Matcher</h1>
  <div class="container">
    <div class="list" id="channelList">
      <h2>Channels</h2>
    </div>
    <div class="list" id="epgList">
      <h2>EPG Entries</h2>
    </div>
  </div>
  <div style="padding: 0 10px 10px 10px;">
    <video id="player" controls autoplay muted></video>
    <button class="btn" onclick="saveMatch()">📝 Save EPG to Channel</button>
  </div>

  <script>
    let selectedChannel = null;
    let selectedEPG = null;

    async function loadChannels() {
      const res = await fetch('/api/channels');
      const channels = await res.json();
      const list = document.getElementById('channelList');
      list.innerHTML += channels.map((c, i) => 
        `<div class="item" onclick="selectChannel(${i})" id="ch${i}" data-url="${encodeURIComponent(c.url)}" data-id="${c.id}">
          📺 ${c.name}
        </div>`
      ).join('');
      window._channels = channels;
    }

    async function loadEPG() {
      const res = await fetch('/api/epg');
      const epg = await res.json();
      const list = document.getElementById('epgList');
      list.innerHTML += epg.map((e, i) => 
        `<div class="item" onclick="selectEPG(${i})" id="epg${i}" data-title="${e.title}">
          ⏰ ${new Date(e.start).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})} - ${e.title}
        </div>`
      ).join('');
      window._epg = epg;
    }

    function selectChannel(index) {
      selectedChannel = window._channels[index];
      document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
      document.getElementById('ch' + index).classList.add('selected');

      const player = document.getElementById('player');
      player.src = `/proxy?url=${encodeURIComponent(selectedChannel.url)}`;
    }

    function selectEPG(index) {
      selectedEPG = window._epg[index];
      document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
      document.getElementById('epg' + index).classList.add('selected');

      const player = document.getElementById('player');
      // if you have EPG samples, you could use e.sample_url
      alert(`Selected EPG: ${selectedEPG.title}`);
    }

    async function saveMatch() {
      if (!selectedChannel || !selectedEPG) return alert("Pick a channel and EPG first.");
      const res = await fetch('/admin/assign_epg', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: selectedChannel.id, epgId: selectedEPG.title })
      });
      const json = await res.json();
      if (json.status === 'success') alert("✅ Assigned!");
      else alert("❌ Error: " + json.message);
    }

    loadChannels();
    loadEPG();
  </script>
</body>
</html>
